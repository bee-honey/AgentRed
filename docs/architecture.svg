<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6b6b66"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#c9c8c3;stroke-width:1.5;rx:8}
      .lbl{font-size:13px;fill:#1d1d1b;font-weight:600}
      .sub{font-size:11px;fill:#6b6b66}
      .grp{font-size:11px;fill:#8a8984;font-weight:700;letter-spacing:.06em}
      .flow{stroke:#6b6b66;stroke-width:1.6;fill:none;marker-end:url(#ar)}
      .tag{font-size:10px;fill:#6b6b66}
      .red{fill:#b42318}.green{fill:#1a7f37}
    </style>
  </defs>
  <rect width="920" height="560" fill="#fbfbfa"/>
  <text x="28" y="34" font-size="18" font-weight="700" fill="#1d1d1b">AgentRed architecture</text>
  <text x="28" y="54" class="sub">Attack an agent, record what it does at the MCP boundary, judge the trace against security invariants.</text>

  <!-- INPUTS -->
  <text x="28" y="90" class="grp">INPUTS</text>
  <rect class="box" x="28" y="100" width="190" height="66" rx="8"/>
  <text x="40" y="124" class="lbl">Scenario</text>
  <text x="40" y="142" class="sub">task · policy · canary secret</text>
  <text x="40" y="157" class="sub">injection point · invariant</text>
  <rect class="box" x="28" y="178" width="190" height="80" rx="8"/>
  <text x="40" y="202" class="lbl">Attack sets</text>
  <text x="40" y="220" class="sub">hand-written · AgentDojo</text>
  <text x="40" y="235" class="sub">persuasion · multi-turn</text>
  <text x="40" y="250" class="sub">adaptive (reactive model)</text>

  <!-- AGENT UNDER TEST -->
  <text x="268" y="90" class="grp">AGENT UNDER TEST</text>
  <rect class="box" x="268" y="100" width="300" height="158" rx="8" fill="#f6f6f4"/>
  <rect class="box" x="284" y="116" width="268" height="60" rx="6"/>
  <text x="296" y="138" class="lbl">AgentRed loop + design controls</text>
  <text x="296" y="156" class="sub">prompt-only → hardened → pinned-tools</text>
  <text x="296" y="170" class="sub">→ policy-guard (code enforcement)</text>
  <rect class="box" x="284" y="184" width="268" height="58" rx="6"/>
  <text x="296" y="206" class="lbl">Black-box agent</text>
  <text x="296" y="224" class="sub">LangGraph · OpenAI Agents SDK</text>
  <text x="296" y="238" class="sub">any framework, via stdin/stdout + MCP</text>

  <!-- BOUNDARY -->
  <text x="268" y="300" class="grp">MCP BOUNDARY — records every call</text>
  <rect class="box" x="268" y="310" width="300" height="56" rx="8" fill="#eef3fb"/>
  <text x="280" y="333" class="lbl">Recording proxy / recording server</text>
  <text x="280" y="351" class="sub">JSON-RPC 2.0 over stdio · tools/list + tools/call</text>
  <rect class="box" x="268" y="384" width="300" height="52" rx="8"/>
  <text x="280" y="406" class="lbl">Tools / third-party MCP server</text>
  <text x="280" y="423" class="sub">test doubles, or a server you scan</text>

  <!-- TRACE + JUDGES -->
  <text x="618" y="90" class="grp">EVIDENCE &amp; VERDICTS</text>
  <rect class="box" x="618" y="100" width="274" height="58" rx="8" fill="#f6f6f4"/>
  <text x="630" y="123" class="lbl">Trace</text>
  <text x="630" y="141" class="sub">tool calls · args · results · blocked attempts</text>
  <rect class="box" x="618" y="172" width="274" height="50" rx="8"/>
  <text x="630" y="193" class="lbl green">Invariant checks — deterministic</text>
  <text x="630" y="210" class="sub">egress · tenant isolation · approval order</text>
  <rect class="box" x="618" y="232" width="274" height="46" rx="8"/>
  <text x="630" y="252" class="lbl">Task-completion check</text>
  <text x="630" y="268" class="sub">did the legitimate request still succeed?</text>
  <rect class="box" x="618" y="288" width="274" height="46" rx="8"/>
  <text x="630" y="308" class="lbl">LLM judge — calibrated vs ground truth</text>
  <text x="630" y="324" class="sub">precision / recall / κ, never trusted blind</text>

  <!-- OUTPUTS -->
  <text x="618" y="372" class="grp">OUTPUTS</text>
  <rect class="box" x="618" y="382" width="274" height="46" rx="8"/>
  <text x="630" y="402" class="lbl">Reports</text>
  <text x="630" y="418" class="sub">JSON · self-contained HTML · SARIF 2.1.0</text>
  <rect class="box" x="618" y="442" width="274" height="50" rx="8" fill="#fdecea"/>
  <text x="630" y="463" class="lbl red">CI gate</text>
  <text x="630" y="480" class="sub">fail the build on regression vs baseline</text>

  <!-- stats footer -->
  <rect class="box" x="28" y="500" width="864" height="40" rx="8" fill="#f6f6f4"/>
  <text x="40" y="524" class="sub"><tspan class="lbl">Statistics everywhere:</tspan>  95% Wilson intervals on every rate · two-sided Fisher's exact tests between targets · offline scripted backend for deterministic, keyless runs.</text>

  <!-- flows -->
  <path class="flow" d="M218,133 L262,150"/>
  <path class="flow" d="M218,218 L262,200"/>
  <path class="flow" d="M418,258 L418,304" stroke-dasharray="0"/>
  <path class="flow" d="M418,366 L418,382"/>
  <path class="flow" d="M568,180 L612,129"/>
  <text x="575" y="150" class="tag">trace</text>
  <path class="flow" d="M892,135 L905,135 L905,197 L896,197" />
  <path class="flow" d="M755,222 L755,230"/>
  <path class="flow" d="M755,278 L755,286"/>
  <path class="flow" d="M755,334 L755,380"/>
  <path class="flow" d="M755,428 L755,440"/>
</svg>
